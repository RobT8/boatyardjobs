name: Aggregate jobs

# Runs the aggregation pipeline on a schedule so the board stays fresh.
# Also runnable on demand from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               https://zpesevmnmaifnooqiyrr.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  the project's service_role secret (NOT the
#                              publishable key — the pipeline inserts published
#                              jobs, which RLS only allows the service role to do)
#   ADZUNA_APP_ID              free from https://developer.adzuna.com
#   ADZUNA_APP_KEY             free from https://developer.adzuna.com
#
# Optional (Google for Jobs Indexing API — pings Google as listings go live /
# come down; the pipeline simply skips it if these are absent):
#   SITE_URL                       e.g. https://boatyardjobs.com (for the URLs sent)
#   GOOGLE_INDEXING_CLIENT_EMAIL   service-account email (Owner of the Search
#                                  Console property, Indexing API enabled)
#   GOOGLE_INDEXING_PRIVATE_KEY    the service account's PEM private key

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run aggregator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_INDEXING_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_CLIENT_EMAIL }}
          GOOGLE_INDEXING_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_PRIVATE_KEY }}
        run: npm run aggregate
