name: Aggregate jobs

# Runs the aggregation pipeline on a schedule so the board stays fresh.
# Also runnable on demand from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               https://zpesevmnmaifnooqiyrr.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  the project's service_role secret (NOT the
#                              publishable key — the pipeline inserts published
#                              jobs, which RLS only allows the service role to do)
#   ADZUNA_APP_ID              free from https://developer.adzuna.com
#   ADZUNA_APP_KEY             free from https://developer.adzuna.com
#
# Optional — Google for Jobs Indexing API (pings Google as listings go live /
# come down). Keyless via Workload Identity Federation: no service-account key is
# stored. The pipeline simply skips indexing if these aren't configured.
# Set as repository *variables* (not secrets — they aren't sensitive):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  full provider resource name, e.g.
#     projects/123456789/locations/global/workloadIdentityPools/github/providers/github-actions
#   GCP_INDEXING_SERVICE_ACCOUNT    service-account email (Owner of the Search
#                                   Console property; Indexing API enabled)
# And as a secret:
#   SITE_URL                        e.g. https://boatyardjobs.com (for the URLs sent)
# See docs/google-indexing-setup.md for the one-time GCP setup.

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Keyless auth to Google. Skipped (and indexing stays off) until the two
      # GCP_* repo variables are set, so the rest of the run is unaffected.
      - id: gauth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INDEXING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run aggregator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Pre-minted, Indexing-API-scoped access token from the auth step above
          # (empty when WIF isn't configured → indexing is a no-op).
          GOOGLE_INDEXING_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: npm run aggregate
